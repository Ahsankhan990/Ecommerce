<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">


</head>

<body>
  <div class="bg"></div>

  <main class="shell">
    <section class="card">
      <div class="brand">
        <div class="logo">🛍️</div>
        <h1>E-Commerce</h1>
        <p class="muted">Welcome back — sign up to continue</p>
      </div>

      {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="alert">{{ messages[0] }}</div>
      {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.signup') }}" novalidate>
        {{ csrf_token() if csrf_token is defined }}
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="name" placeholder="name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required>
        </div>

        <div class="row">
          <label class="checkbox">
            <input type="checkbox" name="remember"> <span>Remember me</span>
          </label>
        </div>

        <button class="btn" type="submit">Sign up</button>

        <p class="muted">
          Already have an account?
          <a class="link" href="{{ url_for('auth.login') }}">Login here</a>
        </p>

      </form>
    </section>

    <footer class="foot">© {{ 2025 }} E-Commerce</footer>
  </main>
</body>

</html>
